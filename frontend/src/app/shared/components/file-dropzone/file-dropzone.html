<div class="w-full">
  <!-- Dropzone Area -->
  <div
    class="relative border-2 border-dashed rounded-xl p-8 flex flex-col items-center justify-center transition-all duration-300 ease-in-out cursor-pointer group"
    [ngClass]="{
      'border-blue bg-blue-50': isDragging,
      'border-border bg-bg hover:bg-white hover:border-blue': !isDragging,
      'border-red bg-red-bg': errorMsg
    }"
    (click)="fileInput.click()"
  >
    <input
      #fileInput
      type="file"
      class="hidden"
      [multiple]="allowMultiple"
      [accept]="acceptedFormats"
      (change)="onFileSelected($event)"
    />

    <!-- Icon Container with bounce effect on hover -->
    <div class="mb-4 text-blue group-hover:-translate-y-1 transition-transform duration-300">
      <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
      </svg>
    </div>

    <!-- Text content -->
    <h3 class="text-lg font-semibold text-ink mb-1">
      Déposez vos fichiers ici
    </h3>
    <p class="text-sm text-slate mb-4 text-center">
      ou cliquez pour parcourir <br/>
      <span class="text-xs text-faint">Formats acceptés: {{ acceptedFormats }}</span>
    </p>

    <!-- Badges -->
    <div class="flex gap-2">
      <span class="px-3 py-1 bg-white shadow-sm border border-line rounded-full text-xs font-medium text-slate">PDF</span>
      <span class="px-3 py-1 bg-white shadow-sm border border-line rounded-full text-xs font-medium text-slate">DOCX</span>
      <span *ngIf="allowMultiple" class="px-3 py-1 bg-white shadow-sm border border-line rounded-full text-xs font-medium text-slate">ZIP</span>
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMsg" class="mt-3 flex items-center text-red text-sm font-medium animate-pulse">
    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    {{ errorMsg }}
  </div>
</div>
