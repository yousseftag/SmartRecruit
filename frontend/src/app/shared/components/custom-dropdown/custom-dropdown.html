<div class="relative w-full">
  <button
    type="button"
    (click)="toggle()"
    [disabled]="disabled()"
    class="w-full px-3 py-2 text-xs bg-white border border-slate-300 hover:border-slate-400 rounded-lg flex items-center justify-between gap-2 shadow-xs transition outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 disabled:bg-slate-50 disabled:text-slate-400 disabled:cursor-not-allowed"
  >
    <div class="flex items-center gap-1.5 truncate text-left">
      @if (prefix()) {
        <span class="text-slate-500 font-medium shrink-0">{{ prefix() }}</span>
      }
      <span
        class="truncate"
        [ngClass]="{
          'text-slate-800 font-semibold': value() && !badgeMode(),
          'text-slate-400 font-normal': !value() || badgeMode(),
        }"
      >
        {{ getDisplayLabel() }}
      </span>
    </div>
    <svg
      lucideChevronDown
      class="w-4 h-4 text-slate-400 shrink-0 transition-transform duration-200"
      [class.rotate-180]="isOpen()"
      size="16"
    ></svg>
  </button>

  @if (isOpen()) {
    <div
      class="absolute left-0 right-0 top-full mt-1.5 bg-white border border-slate-200 rounded-xl shadow-lg z-30 py-1 max-h-56 overflow-y-auto animate-in fade-in slide-in-from-top-1 duration-150"
    >
      @for (option of options(); track getOptionValue(option)) {
        <button
          type="button"
          (click)="selectOption(option)"
          class="w-full px-3 py-2 text-left text-xs flex items-center justify-between hover:bg-slate-50 transition-colors"
          [ngClass]="{
            'text-blue-700 font-semibold bg-blue-50/60': isSelected(option),
            'text-slate-700': !isSelected(option),
          }"
        >
          <span class="truncate">{{ getOptionLabel(option) }}</span>
          @if (isSelected(option)) {
            <svg lucideCheck class="w-3.5 h-3.5 text-blue-600 shrink-0 ml-2" size="14"></svg>
          }
        </button>
      }
      @if (options().length === 0) {
        <div class="px-3 py-2 text-xs text-slate-400 italic text-center">
          Aucune option disponible
        </div>
      }
    </div>
  }
</div>
