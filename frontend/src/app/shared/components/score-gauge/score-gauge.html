<div class="flex flex-col items-center justify-center p-4 bg-white rounded-2xl shadow-sm border border-gray-100">
  <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Score Global</h3>
  
  <div class="relative flex items-center justify-center">
    <!-- Background Circle -->
    <svg class="transform -rotate-90 w-32 h-32">
      <circle
        cx="64"
        cy="64"
        r="45"
        stroke="currentColor"
        stroke-width="8"
        fill="transparent"
        class="text-gray-100"
      />
      <!-- Progress Circle -->
      <circle
        cx="64"
        cy="64"
        r="45"
        stroke="currentColor"
        stroke-width="8"
        fill="transparent"
        [class]="colorClass"
        [attr.stroke-dasharray]="circumference"
        [attr.stroke-dashoffset]="dashoffset"
        class="transition-all duration-1000 ease-out"
        stroke-linecap="round"
      />
    </svg>
    
    <!-- Score Text -->
    <div class="absolute flex flex-col items-center justify-center">
      <span class="text-3xl font-bold text-gray-800">{{ score | number:'1.0-0' }}%</span>
    </div>
  </div>

  <p class="mt-4 text-sm font-medium text-gray-600 text-center">
    {{ summaryText }}
  </p>
</div>
