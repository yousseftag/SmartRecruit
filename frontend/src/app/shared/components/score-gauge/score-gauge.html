<div class="flex flex-col items-center justify-center p-4 bg-white rounded-2xl border border-line">
  <div class="relative flex items-center justify-center">
    <!-- Background Circle -->
    <svg class="transform -rotate-90 w-32 h-32">
      <circle
        cx="64"
        cy="64"
        r="45"
        stroke="currentColor"
        stroke-width="8"
        fill="transparent"
        class="text-line"
      />
      <!-- Progress Circle -->
      @if (score() !== null && score() !== undefined) {
        <circle
          cx="64"
          cy="64"
          r="45"
          stroke="currentColor"
          stroke-width="8"
          fill="transparent"
          [class]="colorClass()"
          [attr.stroke-dasharray]="circumference"
          [attr.stroke-dashoffset]="dashoffset()"
          class="transition-all duration-1000 ease-out"
          stroke-linecap="round"
        />
      }
    </svg>

    <!-- Score Text -->
    <div class="absolute flex flex-col items-center justify-center">
      @if (score() !== null && score() !== undefined) {
        <span class="text-3xl font-extrabold text-ink tracking-tight">
          {{ score() | number: '1.0-0' }}%
        </span>
      } @else {
        <span class="text-2xl font-bold text-slate"> -- </span>
      }
    </div>
  </div>

  @if (showSummary()) {
    <p class="mt-4 text-xs font-semibold text-slate text-center">
      {{ summaryText() }}
    </p>
  }
</div>
