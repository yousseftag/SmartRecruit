<div class="relative w-full">
  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggleDropdown()"
    [disabled]="disabled()"
    class="w-full bg-white border border-line hover:border-slate-300 text-ink text-xs font-semibold rounded-lg px-3 py-2 flex items-center justify-between gap-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all disabled:bg-slate-100 disabled:cursor-not-allowed shadow-2xs"
  >
    <div class="flex items-center gap-2 min-w-0">
      <svg [lucideIcon]="LucideMail" class="w-4 h-4 text-blue-600 shrink-0"></svg>
      @if (getSelectedTemplate(); as current) {
        <span class="truncate text-ink font-medium">{{ current.name }}</span>
        <span
          [ngClass]="getBadgeClass(current.templateKey)"
          class="text-[10px] font-semibold px-1.5 py-0.2 rounded border shrink-0"
        >
          {{ getBadgeLabel(current.templateKey) }}
        </span>
      } @else {
        <span class="text-slate-400 font-normal truncate">{{ placeholder() }}</span>
      }
    </div>

    <svg
      [lucideIcon]="LucideChevronDown"
      [class.rotate-180]="isOpen()"
      class="w-4 h-4 text-slate-400 transition-transform shrink-0"
    ></svg>
  </button>

  <!-- Dropdown Popover Menu -->
  @if (isOpen()) {
    <div
      class="absolute left-0 right-0 mt-1.5 bg-white border border-line rounded-xl shadow-xl z-50 max-h-72 overflow-y-auto py-1.5 animate-in fade-in zoom-in-95"
    >
      @for (template of templates(); track template.id) {
        <button
          type="button"
          (click)="selectTemplate(template)"
          [class.bg-blue-50]="selectedTemplateId() === template.id"
          class="w-full px-3 py-2 text-left hover:bg-slate-50 flex items-center justify-between gap-2 transition-colors group"
        >
          <div class="flex items-center gap-2 min-w-0">
            <span
              [class.text-blue-600]="selectedTemplateId() === template.id"
              class="text-xs font-semibold text-ink truncate group-hover:text-blue-600"
            >
              {{ template.name }}
            </span>
            <span
              [ngClass]="getBadgeClass(template.templateKey)"
              class="text-[10px] font-semibold px-1.5 py-0.2 rounded border shrink-0"
            >
              {{ getBadgeLabel(template.templateKey) }}
            </span>
          </div>

          @if (selectedTemplateId() === template.id) {
            <svg [lucideIcon]="LucideCheck" class="w-4 h-4 text-blue-600 shrink-0"></svg>
          }
        </button>
      }

      @if (showCreateOption()) {
        <div class="border-t border-line my-1"></div>
        <button
          type="button"
          (click)="triggerCreate()"
          class="w-full px-3 py-2 text-left hover:bg-blue-50 text-blue-600 text-xs font-bold flex items-center gap-2 transition-colors"
        >
          <svg [lucideIcon]="LucidePlus" class="w-4 h-4"></svg>
          Créer un nouveau modèle...
        </button>
      }
    </div>
  }
</div>
