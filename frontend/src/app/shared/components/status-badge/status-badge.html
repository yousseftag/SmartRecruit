<span
  class="inline-flex items-center gap-1.5 rounded-full font-semibold border transition-colors whitespace-nowrap"
  [ngClass]="[
    statusConfig().classes,
    size() === 'sm' ? 'px-2.5 py-0.5 text-xs' : 'px-3.5 py-1 text-sm'
  ]"
>
  <span
    class="w-1.5 h-1.5 rounded-full flex-shrink-0"
    [ngClass]="statusConfig().dotClass"
  ></span>
  <span>{{ statusConfig().label }}</span>
</span>
