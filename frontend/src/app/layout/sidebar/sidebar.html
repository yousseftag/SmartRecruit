<!-- Sidebar container -->
<div class="sidebar">
  <!-- Brand Header -->
  <div class="brand">
    <div class="brand-badge">
      <!-- Official logo image -->
      <img src="/favicon.ico" alt="Smart Recruit Logo" style="height: 24px" />
    </div>
    <!-- Brand name -->
    <div class="brand-name">Smart Recruit</div>
  </div>

  <!-- Navigation Links -->
  <nav class="nav">
    @for (item of navItems; track item.route) {
      @if (hasAccess(item.roles)) {
        <!-- Navigation item -->
        <a [routerLink]="item.route" [class.active]="isRouteActive(item.route)" class="nav-item">
          <!-- Dynamic Lucide Icon -->
          <svg [lucideIcon]="item.icon"></svg>

          <span>{{ item.label }}</span>
        </a>
      }
    }
  </nav>

  <!-- Public Careers Portal Quick Link -->
  <div class="p-3 border-t border-line mt-auto">
    <a
      routerLink="/careers"
      target="_blank"
      class="flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-muted hover:text-blue hover:bg-blue-50/50 transition-all border border-line"
      title="Ouvrir le portail carrières public dans un nouvel onglet"
    >
      <span class="flex items-center gap-2">
        <svg lucideGlobe style="width: 16px; height: 16px"></svg>
        <span>Site Carrières Public</span>
      </span>
      <svg lucideExternalLink style="width: 13px; height: 13px; opacity: 0.6"></svg>
    </a>
  </div>
</div>
