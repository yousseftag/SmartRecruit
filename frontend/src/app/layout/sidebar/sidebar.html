<!-- Sidebar container -->
<div class="sidebar">
  <!-- Brand Header -->
  <div class="brand">
    <div class="brand-badge">
      <!-- Official logo image -->
      <img src="/favicon.ico" alt="Smart Recruit Logo" style="height: 24px" />
    </div>
    <!-- Brand name -->
    <div class="brand-name">Smart Recruit</div>
  </div>

  <!-- Navigation Links -->
  <nav class="nav">
    @for (item of navItems; track item.route) {
      @if (hasAccess(item.roles)) {
        <!-- Navigation item -->
        <a
          [routerLink]="item.route"
          [class.active]="isRouteActive(item.route)"
          class="nav-item"
        >
          <!-- Dynamic Lucide Icon -->
          <svg [lucideIcon]="item.icon"></svg>

          <span>{{ item.label }}</span>
        </a>
      }
    }
  </nav>
</div>
