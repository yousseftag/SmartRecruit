<header class="topbar">
  <!-- Dynamic Page Title mapped to the router -->
  <div class="topbar-title">{{ pageTitle() }}</div>

  <div class="topbar-right">
    <div class="topbar-user topbar-trigger" (click)="toggleDropdown($event)">
      <div class="txt">
        <div class="nm">{{ userName() }}</div>
        <div class="rl">{{ userRole() }}</div>
      </div>

      <!-- Avatar relies on dynamic 2-letter initials -->
      <img
        [src]="
          'https://ui-avatars.com/api/?name=' +
          userInitials() +
          '&background=e2e8f0&color=0f172a&bold=true'
        "
        alt="User Avatar"
        class="avatar avatar-38"
      />

      @if (isDropdownOpen()) {
        <!-- The dropdown uses global CSS variables to support theme switching seamlessly -->
        <div class="dropdown-menu" (click)="$event.stopPropagation()">
          <div class="dropdown-header">
            <img
              [src]="
                'https://ui-avatars.com/api/?name=' +
                userInitials() +
                '&background=e2e8f0&color=0f172a&bold=true'
              "
              alt="Avatar"
              class="avatar avatar-38"
            />
            <div class="dropdown-user-info">
              <span class="dropdown-user-name">{{ userName() }}</span>
              <span class="dropdown-user-email">{{ userEmail() }}</span>
            </div>
          </div>

          <div class="dropdown-body">
            <a (click)="manageAccount()" class="dropdown-item">
              <svg lucideUser></svg> Modifier le profil
            </a>

            <div class="dropdown-divider"></div>

            <a (click)="changePassword()" class="dropdown-item">
              <svg lucideKey></svg> Changer le mot de passe
            </a>

            <div (click)="toggleDarkMode($event)" class="dropdown-item toggle-item">
              <div class="toggle-label"><svg lucideMoon></svg> Mode nuit</div>

              <!-- Angular class binding replaces inline conditional styles -->
              <div class="toggle-switch" [class.on]="isDarkMode()">
                <div class="toggle-dot"></div>
              </div>
            </div>

            <div class="dropdown-divider"></div>

            <a class="dropdown-item"> <svg lucideCircleHelp></svg> Centre d'aide </a>

            <div class="dropdown-footer">
              <a (click)="logout()" class="dropdown-btn"> <svg lucideLogOut></svg> Déconnexion </a>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</header>

<!-- Edit Profile Modal -->
@if (isProfileModalOpen()) {
  <app-edit-profile (closeModal)="onProfileModalClose($event)"></app-edit-profile>
}

<!-- Toast Notification -->
@if (profileSuccessMessage()) {
  <div class="toast-notification">
    <svg lucideCircleCheck style="width: 20px; height: 20px"></svg>
    <span>{{ profileSuccessMessage() }}</span>
  </div>
}
