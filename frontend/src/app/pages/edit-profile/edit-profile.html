<div class="modal-backdrop">
  <div
    class="card card-pad modal-content"
    style="
      padding: 36px 40px;
      max-width: 680px;
      width: 92%;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    "
    (click)="$event.stopPropagation()"
  >
    <div class="page-head" style="margin-bottom: 24px">
      <h1 class="h1" style="margin: 0">Modifier mon profil</h1>
    </div>

    <form
      [formGroup]="profileForm"
      (ngSubmit)="onSubmit()"
      style="display: flex; flex-direction: column; flex: 1; justify-content: space-between;"
    >
      <div>
        <!-- Notifications -->
        @if (successMessage()) {
          <div class="alert-success">
            {{ successMessage() }}
          </div>
        }

        @if (errorMessage()) {
          <div class="alert-error">
            {{ errorMessage() }}
          </div>
        }

        <!-- Disabled Fields (Visual Only) -->
        <div class="two-col" style="margin-bottom: 20px">
          <div class="field">
            <label class="label">Nom d'utilisateur</label>
            <input type="text" class="input input-disabled" [value]="username()" disabled />
          </div>
          <div class="field">
            <label class="label">Rôle</label>
            <input type="text" class="input input-disabled" [value]="role()" disabled />
          </div>
        </div>

        <!-- Editable Fields -->
        <div class="two-col" style="margin-bottom: 20px">
          <div class="field">
            <label class="label">Prénom</label>
            <input
              type="text"
              class="input"
              formControlName="firstName"
              placeholder="Votre prénom"
            />
          </div>
          <div class="field">
            <label class="label">Nom</label>
            <input type="text" class="input" formControlName="lastName" placeholder="Votre nom" />
          </div>
        </div>

        <div class="field" style="margin-bottom: 28px">
          <label class="label">Adresse e-mail</label>
          <input
            type="email"
            class="input"
            formControlName="email"
            placeholder="votre.email@exemple.com"
          />
        </div>
      </div>

      <div
        class="footer-bar"
        style="
          padding: 0;
          border: none;
          display: flex;
          gap: 12px;
          justify-content: flex-end;
          margin-top: auto;
          padding-top: 16px;
        "
      >
        <button type="button" class="btn btn-outline" (click)="onCancel()">Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
          {{ isSaving() ? 'Enregistrement...' : 'Enregistrer les modifications' }}
        </button>
      </div>
    </form>
  </div>
</div>
