server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smartrecruit-backend

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  
  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:smartrecruit}}
    username: ${SPRING_DATASOURCE_USER:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  
  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    clean-disabled: true
  
  # JPA Configuration
  jpa:
    hibernate:
      # MUST be 'validate' (or 'none') when using Flyway. 
      # Do not use 'update' because Flyway manages the schema now.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.url}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 2000ms
          multiplier: 2.0
          max-interval: 10000ms

keycloak:
  realm: smartrecruit
  url: ${KEYCLOAK_URL:http://localhost:8081}/realms/${keycloak.realm}
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
    admin-realm: master
    client-id: admin-cli
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

# Custom MinIO properties
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: resumes

springdoc:
  swagger-ui:
    persist-authorization: true
    oauth:
      clientId: smartrecruit-frontend

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  cv-ingestion:
    stall-threshold-minutes: ${CV_STALL_THRESHOLD_MINUTES:5}
  ai-simulation:
    enabled: ${AI_SIMULATION_ENABLED:true}

