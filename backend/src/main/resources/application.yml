server:
  port: 8080

spring:
  application:
    name: smartrecruit-backend
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/smartrecruit
    username: postgres
    password: postgres # Update with your local setup
    driver-class-name: org.postgresql.Driver
  
  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    clean-disabled: true
  
  # JPA Configuration
  jpa:
    hibernate:
      # MUST be 'validate' (or 'none') when using Flyway. 
      # Do not use 'update' because Flyway manages the schema now.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.url}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

keycloak:
  realm: smartrecruit
  url: http://localhost:8081/realms/${keycloak.realm}
