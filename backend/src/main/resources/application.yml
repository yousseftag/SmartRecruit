server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smartrecruit-backend

  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartrecruit}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    clean-disabled: true
  
  # JPA Configuration
  jpa:
    hibernate:
      # MUST be 'validate' (or 'none') when using Flyway. 
      # Do not use 'update' because Flyway manages the schema now.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.url}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

keycloak:
  realm: smartrecruit
  url: ${KEYCLOAK_URL:http://localhost:8081}/realms/${keycloak.realm}
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
    admin-realm: master
    client-id: admin-cli
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
